<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | SC Industries</title>
  <meta name="description" content="Browse hardware, furniture, kitchen, technology and bathroom products at SC Industries.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="products" class="font-sans">
  <div id="site-header"></div>

  <main>
    <section class="dots border-b border-grape-100">
      <div class="mx-auto max-w-7xl px-4 py-12">
        <nav class="text-sm text-ink/60" aria-label="Breadcrumb">
          <a href="index.html" class="hover:text-grape-700">Home</a> <span class="mx-1">/</span>
          <span id="crumb" class="font-semibold text-ink">Shop</span>
        </nav>
        <h1 id="page-title" class="mt-3 font-display text-5xl font-semibold text-grape-900">All products</h1>
        <p id="page-blurb" class="mt-2 max-w-2xl text-lg text-ink/70">Tools, furniture, kitchenware, tech and bathroom bits, all in one friendly place.</p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 pt-8">
      <!-- Category pills -->
      <div id="category-pills" class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-2" role="tablist" aria-label="Filter by category"></div>

      <!-- Toolbar -->
      <div class="mt-6 flex flex-col gap-4 rounded-blob bg-white p-4 shadow-soft ring-1 ring-grape-100 md:flex-row md:items-center md:justify-between">
        <div class="relative md:w-80">
          <label for="search" class="sr-only">Search products</label>
          <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-grape-400" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search products…" class="w-full rounded-full border-2 border-grape-100 bg-cream py-2.5 pl-11 pr-4 font-semibold outline-none transition focus:border-grape-400">
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <label class="flex cursor-pointer items-center gap-2 font-semibold text-ink/80">
            <input id="on-sale" type="checkbox" class="h-5 w-5 rounded accent-grape-600">
            On sale
          </label>
          <p id="result-count" class="text-ink/60" aria-live="polite"></p>
          <label for="sort" class="sr-only">Sort products</label>
          <select id="sort" class="rounded-full border-2 border-grape-100 bg-cream px-4 py-2.5 font-semibold text-ink outline-none focus:border-grape-400">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="rating">Top rated</option>
            <option value="newest">Newest</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
          </select>
        </div>
      </div>

      <div id="product-grid" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

      <div id="empty-state" class="mt-10 hidden rounded-blob bg-white p-12 text-center shadow-soft ring-1 ring-grape-100">
        <p class="text-5xl">🔍</p>
        <h2 class="mt-4 font-display text-2xl font-semibold text-grape-900">No products match that search</h2>
        <p class="mt-2 text-ink/70">Try a different word, or clear the filters to see everything.</p>
        <button id="clear-filters" type="button" class="mt-6 rounded-full bg-grape-700 px-6 py-3 font-bold text-white hover:bg-grape-800">Clear filters</button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
